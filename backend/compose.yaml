services:
  battery-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-13013}:8000"
    env_file:
      - setup.env
    environment:
      STATE_FILE: /data/state.json
    volumes:
      - battery-state:/data

volumes:
  battery-state:
